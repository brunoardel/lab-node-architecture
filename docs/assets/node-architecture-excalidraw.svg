<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 720" width="100%" height="100%">
  <defs>
    <!-- Filtro de rugosidade sutil estilo Excalidraw -->
    <filter id="excalidraw-rough" x="-5%" y="-5%" width="110%" height="110%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Marcadores de seta desenhados à mão -->
    <marker id="arrow-sketch" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
    </marker>

    <!-- Estilo de fonte feito à mão (Virgil / Comic Sans / Caveat / Hand-drawn feel) -->
    <style>
      .sketch-text {
        font-family: 'Virgil', 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif;
        fill: #1e293b;
      }
      .sketch-title {
        font-weight: bold;
        font-size: 17px;
      }
      .sketch-body {
        font-size: 13.5px;
        fill: #334155;
      }
      .sketch-annotation {
        font-size: 12px;
        font-style: italic;
      }
    </style>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="1060" height="720" fill="#fcfbf7" />

  <!-- ========================================== -->
  <!-- CONTAINER PRINCIPAL: PROCESSO NODE.JS      -->
  <!-- ========================================== -->
  <g filter="url(#excalidraw-rough)">
    <!-- Sombra/dupla camada estilo Excalidraw -->
    <rect x="23" y="23" width="1014" height="674" rx="18" fill="none" stroke="#e2e8f0" stroke-width="4" />
    <rect x="20" y="20" width="1014" height="674" rx="18" fill="#ffffff" stroke="#334155" stroke-width="2.8" stroke-dasharray="14 8" />
  </g>
  <text x="50" y="52" class="sketch-text sketch-title" font-size="20" fill="#0f172a">
    📦 PROCESSO NODE.JS (SO PID) &amp; os.availableParallelism()
  </text>
  <text x="680" y="52" class="sketch-text sketch-annotation" fill="#64748b">
    *Desenho mental da arquitetura (Estilo Excalidraw)*
  </text>

  <!-- ========================================== -->
  <!-- CAIXA 1: MAIN THREAD (V8 SINGLE-THREAD)    -->
  <!-- ========================================== -->
  <g filter="url(#excalidraw-rough)">
    <rect x="52" y="82" width="460" height="380" rx="14" fill="#e0f2fe" opacity="0.6" stroke="none" />
    <rect x="50" y="80" width="460" height="380" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5" />
  </g>
  <text x="75" y="112" class="sketch-text sketch-title" fill="#0369a1">
    🧵 MAIN THREAD (Thread Principal - V8 Isolate)
  </text>
  <text x="75" y="132" class="sketch-text sketch-annotation" fill="#0284c7">
    ⚡ Execução JavaScript Single-Threaded nativa
  </text>

  <!-- Subcaixa: CALL STACK -->
  <g filter="url(#excalidraw-rough)">
    <rect x="75" y="152" width="410" height="110" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.2" />
  </g>
  <text x="95" y="180" class="sketch-text sketch-title" fill="#854d0e">
    📚 CALL STACK (Pilha de Execução do V8)
  </text>
  <text x="95" y="202" class="sketch-text sketch-body">
    • Executa código síncrono linha por linha
  </text>
  <text x="95" y="222" class="sketch-text sketch-body">
    • Se entrar um cálculo pesado...
  </text>
  <text x="95" y="244" class="sketch-text sketch-title" fill="#b91c1c" font-size="14">
    💥 CPU-BOUND bloqueia TUDO! (Event Loop Lag infinito)
  </text>

  <!-- Subcaixa: EVENT LOOP -->
  <g filter="url(#excalidraw-rough)">
    <rect x="75" y="280" width="410" height="160" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2.2" />
  </g>
  <text x="95" y="308" class="sketch-text sketch-title" fill="#6b21a8">
    🔄 EVENT LOOP (Orquestrador Assíncrono)
  </text>
  <text x="95" y="330" class="sketch-text sketch-body">
    • Microtasks: <code>Promise.then()</code>, <code>queueMicrotask</code>
  </text>
  <text x="95" y="352" class="sketch-text sketch-body">
    • Timers: <code>setTimeout()</code>, <code>setInterval()</code>
  </text>
  <text x="95" y="374" class="sketch-text sketch-body">
    • I/O Callbacks: Respostas de rede / disco prontas
  </text>
  <text x="95" y="396" class="sketch-text sketch-body">
    • Check: <code>setImmediate()</code> (Técnica de Chunking)
  </text>
  <text x="95" y="420" class="sketch-text sketch-annotation" fill="#7e22ce">
    🔁 Só avança para o próximo item quando a Call Stack esvazia!
  </text>

  <!-- ========================================== -->
  <!-- CAIXA 2: LIBUV & SO (I/O NÃO-BLOQUEANTE)   -->
  <!-- ========================================== -->
  <g filter="url(#excalidraw-rough)">
    <rect x="552" y="82" width="450" height="230" rx="14" fill="#dcfce7" opacity="0.6" stroke="none" />
    <rect x="550" y="80" width="450" height="230" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
  </g>
  <text x="575" y="112" class="sketch-text sketch-title" fill="#15803d">
    🌐 libuv &amp; KERNEL DO S.O. (Multi-Threaded I/O)
  </text>
  <text x="575" y="132" class="sketch-text sketch-annotation" fill="#16a34a">
    Delegado fora da Main Thread: Nunca trava o JS!
  </text>

  <!-- Sub-blocos da libuv -->
  <g filter="url(#excalidraw-rough)">
    <rect x="575" y="150" width="195" height="135" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.8" />
    <rect x="785" y="150" width="195" height="135" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.8" />
  </g>
  <text x="590" y="176" class="sketch-text sketch-title" font-size="14" fill="#166534">Kernel Assíncrono</text>
  <text x="590" y="198" class="sketch-text sketch-body">• Sockets TCP/HTTP</text>
  <text x="590" y="218" class="sketch-text sketch-body">• Epoll / Kqueue</text>
  <text x="590" y="240" class="sketch-text sketch-body">• DNS resolve</text>
  <text x="590" y="265" class="sketch-text sketch-annotation" fill="#15803d">🚀 I/O Não-Bloqueante</text>

  <text x="800" y="176" class="sketch-text sketch-title" font-size="14" fill="#166534">libuv Threadpool</text>
  <text x="800" y="198" class="sketch-text sketch-body">• File System (fs)</text>
  <text x="800" y="218" class="sketch-text sketch-body">• Crypto (pbkdf2)</text>
  <text x="800" y="240" class="sketch-text sketch-body">• Zlib (compress)</text>
  <text x="800" y="265" class="sketch-text sketch-annotation" fill="#15803d">4 threads padrão</text>

  <!-- ========================================== -->
  <!-- CAIXA 3: WORKER POOL (node:worker_threads) -->
  <!-- ========================================== -->
  <g filter="url(#excalidraw-rough)">
    <rect x="552" y="332" width="450" height="240" rx="14" fill="#ffedd5" opacity="0.6" stroke="none" />
    <rect x="550" y="330" width="450" height="240" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" />
  </g>
  <text x="575" y="362" class="sketch-text sketch-title" fill="#c2410c">
    ⚙️ node:worker_threads &amp; WorkerPool
  </text>
  <text x="575" y="382" class="sketch-text sketch-annotation" fill="#ea580c">
    ✅ Padrão Ouro para CPU-Bound: Paralelismo Real de CPU
  </text>

  <!-- Subcaixas dos Workers -->
  <g filter="url(#excalidraw-rough)">
    <rect x="575" y="400" width="125" height="85" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.8" />
    <rect x="712" y="400" width="125" height="85" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.8" />
    <rect x="850" y="400" width="130" height="85" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.8" />
  </g>
  <text x="590" y="425" class="sketch-text sketch-title" font-size="13" fill="#9a3412">Worker #1</text>
  <text x="590" y="445" class="sketch-text sketch-annotation">V8 Isolate #1</text>
  <text x="590" y="465" class="sketch-text sketch-body" fill="#16a34a">🟢 Ocioso (Idle)</text>

  <text x="727" y="425" class="sketch-text sketch-title" font-size="13" fill="#9a3412">Worker #2</text>
  <text x="727" y="445" class="sketch-text sketch-annotation">V8 Isolate #2</text>
  <text x="727" y="465" class="sketch-text sketch-body" fill="#ea580c">🔥 Ocupado (Busy)</text>

  <text x="865" y="425" class="sketch-text sketch-title" font-size="13" fill="#9a3412">Worker #N</text>
  <text x="865" y="445" class="sketch-text sketch-annotation">V8 Isolate #N</text>
  <text x="865" y="465" class="sketch-text sketch-body" fill="#16a34a">🟢 Ocioso (Idle)</text>

  <!-- Rodapé do WorkerPool -->
  <text x="575" y="515" class="sketch-text sketch-body">
    • Comunicação: <code>postMessage()</code> (Structured Clone)
  </text>
  <text x="575" y="535" class="sketch-text sketch-body">
    • Zero-Copy: <code>ArrayBuffer</code> (Transferable) / <code>SharedArrayBuffer</code>
  </text>
  <text x="575" y="555" class="sketch-text sketch-annotation" fill="#9a3412">
    🛡️ Auto-Recuperação: Recria worker se falhar sem derrubar a API!
  </text>

  <!-- ========================================== -->
  <!-- CAIXA 4: ALTERNATIVA EXTERNA (child_process) -->
  <!-- ========================================== -->
  <g filter="url(#excalidraw-rough)">
    <rect x="52" y="482" width="460" height="90" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" />
  </g>
  <text x="75" y="510" class="sketch-text sketch-title" font-size="15" fill="#334155">
    🔀 Alternativa: Processos Filhos (child_process.fork)
  </text>
  <text x="75" y="532" class="sketch-text sketch-body">
    • Outro processo Node.js completo no SO com Heap e V8 próprios
  </text>
  <text x="75" y="552" class="sketch-text sketch-annotation" fill="#64748b">
    ⚠️ Maior consumo de memória RAM comparado a Worker Threads (~30MB+ por processo)
  </text>

  <!-- ========================================== -->
  <!-- POST-IT AMARELO (STICKY NOTE) ESTILO EXCALIDRAW -->
  <!-- ========================================== -->
  <g transform="translate(180, 590) rotate(-1.5)" filter="url(#excalidraw-rough)">
    <rect x="0" y="0" width="310" height="90" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8" />
    <text x="15" y="26" class="sketch-text sketch-title" font-size="14" fill="#854d0e">📌 Dica Prática de Produção:</text>
    <text x="15" y="48" class="sketch-text sketch-body" font-size="12">I/O (banco/rede) ➔ Deixe na Main Thread!</text>
    <text x="15" y="68" class="sketch-text sketch-body" font-size="12">Cálculo pesado (>50ms) ➔ Mande pro WorkerPool!</text>
  </g>

  <!-- POST-IT AZUL (STICKY NOTE) -->
  <g transform="translate(560, 590) rotate(1.2)" filter="url(#excalidraw-rough)">
    <rect x="0" y="0" width="360" height="90" rx="4" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.8" />
    <text x="15" y="26" class="sketch-text sketch-title" font-size="14" fill="#3730a3">💡 Conclusão do Experimento:</text>
    <text x="15" y="48" class="sketch-text sketch-body" font-size="12">/bloqueante: /health atrasou 2.136ms 🛑</text>
    <text x="15" y="68" class="sketch-text sketch-body" font-size="12">/otimizada: /health respondeu em 7ms ✅</text>
  </g>

  <!-- ========================================== -->
  <!-- SETAS / CONECTORES ESTILO EXCALIDRAW       -->
  <!-- ========================================== -->
  <!-- Seta Main Thread -> libuv -->
  <path d="M 510 180 Q 530 170 546 175" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="495" y="162" class="sketch-text sketch-annotation" fill="#15803d" font-weight="bold">I/O Offload</text>

  <!-- Seta libuv -> Event Loop (Notificação) -->
  <path d="M 550 250 Q 520 270 488 300" fill="none" stroke="#7e22ce" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow-sketch)" />
  <text x="502" y="285" class="sketch-text sketch-annotation" fill="#7e22ce">Callback</text>

  <!-- Seta Call Stack -> WorkerPool (Offloading de CPU) -->
  <path d="M 485 220 Q 525 240 548 350" fill="none" stroke="#ea580c" stroke-width="2.8" marker-end="url(#arrow-orange)" />
  <text x="515" y="325" class="sketch-text sketch-annotation" fill="#c2410c" font-weight="bold">CPU Offload</text>

</svg>
